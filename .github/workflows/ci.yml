name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
      - "claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `check` is the hard floor (GrillTrack ci-floor-014): unit tests,
      # Android Lint against lint-baseline.xml with warnings as errors, and
      # detektDebug (Compose rules, formatting, comment ban, forbidden
      # imports/calls). Kotlin compiles with allWarningsAsErrors. Any new
      # warning anywhere fails this job; the baseline only ever shrinks.
      - name: Hard floor (tests, lint, detekt) + debug assemble
        run: ./gradlew --no-daemon check assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: repoglance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint, detekt, and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: floor-reports
          path: |
            app/build/reports/**
