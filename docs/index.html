<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoGlance</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    padding: 2rem 1.25rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    line-height: 1.6;
    color: #1c1e21;
    background: #ffffff;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.75rem;
    line-height: 1.25;
    margin: 0 0 0.5rem;
  }
  p {
    margin: 0.75rem 0;
  }
  a {
    color: #0b63c5;
    text-decoration: underline;
    word-break: break-word;
  }
  @media (prefers-color-scheme: dark) {
    body {
      background: #0d1117;
      color: #e6edf3;
    }
    a {
      color: #6cb6ff;
    }
  }
</style>
</head>
<body>
<main>
  <h1>RepoGlance</h1>
  <p>RepoGlance is a read-only Android home-screen widget that shows information about GitHub repositories.</p>
  <p><a href="privacy/">Privacy policy</a></p>
</main>
</body>
</html>
